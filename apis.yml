aid: meshcapade
name: Meshcapade
description: >-
  Meshcapade builds digital humans - technology that turns images, video, motion
  capture, body measurements or text prompts into anatomically accurate,
  animation-ready 3D avatars. Its platform is built on the SMPL, SMPL-X and SUPR
  parametric body-model family that originated at the Max Planck Institute for
  Intelligent Systems in Tuebingen, Germany. Meshcapade offers a hosted
  avatar-creation platform at me.meshcapade.com and a REST API for programmatic
  avatar generation, plus open-source body-model libraries and integrations for
  Blender, Maya and Unreal Engine. Customers span fashion, robotics, gaming and
  animation, fitness, and scientific research.
